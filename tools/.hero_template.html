<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roivy Diagram</title>
<style>
:root{--bg:#050508;--text:#f0f0f5;--dim:rgba(240,240,245,.45);--blue:#4493f8;--cyan:#22d3ee;--violet:#8b5cf6;--glow-b:rgba(68,147,248,.35);--glow-v:rgba(139,92,246,.22);--glow-c:rgba(34,211,238,.25);--line:rgba(255,255,255,.08);--panel:rgba(255,255,255,.03)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI','Microsoft YaHei',sans-serif;overflow:hidden}
.stage-glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 40% at 20% -10%,var(--glow-b),transparent 60%),radial-gradient(ellipse 50% 35% at 85% 15%,var(--glow-v),transparent 55%),radial-gradient(ellipse 40% 30% at 50% 110%,var(--glow-c),transparent 50%)}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 24px;position:relative;z-index:10;background:rgba(5,5,8,.85);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:15px}.brand em{background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:normal}
.crumb{color:var(--dim);font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtns{display:flex;gap:6px}
.navbtns button{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:12px}
.navbtns button:hover{border-color:var(--blue);box-shadow:0 0 12px var(--glow-b)}
.slide{flex:1;display:none;flex-direction:column;min-height:0;position:relative;z-index:1}
.slide.active{display:flex}
.frame{flex:1 1 auto;min-height:0}
.frame iframe{width:100%;height:100%;border:0;display:block}
.scene{flex:0 0 auto;display:flex;gap:14px;padding:10px 20px 8px;position:relative;z-index:5;background:rgba(5,5,8,.9);border-bottom:1px solid var(--line)}
.scene .no{flex:0 0 auto;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 4px 12px var(--glow-b)}
.scene h2{font-size:15px;margin-bottom:2px}.scene p{color:var(--dim);font-size:11.5px}
.scene .tags{margin-top:3px;display:flex;gap:5px}
.scene .tag{font-size:9.5px;color:var(--cyan);border:1px solid rgba(34,211,238,.25);border-radius:999px;padding:1px 7px;background:rgba(34,211,238,.06)}
.progress{position:fixed;left:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--cyan));width:0;transition:width .3s;z-index:99}
/* ===== Entry sweep: a light band travels top -> bottom once on page entry ===== */
.slide.fx-sweep::after{content:'';position:absolute;inset:0;z-index:8;pointer-events:none;transform:translateY(-100%);
background:linear-gradient(180deg,transparent 0%,rgba(68,147,248,0) 30%,rgba(34,211,238,.14) 46%,rgba(255,255,255,.30) 50%,rgba(34,211,238,.14) 54%,rgba(68,147,248,0) 70%,transparent 100%);
animation:rdSweepDown 1.5s cubic-bezier(.4,0,.2,1) 1 forwards}
@keyframes rdSweepDown{0%{transform:translateY(-100%);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(100%);opacity:0}}
/* ===== Pure-tech cover ===== */
.cover{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:0}
.cover-grid{position:absolute;left:-25%;right:-25%;bottom:-12%;height:72%;pointer-events:none;
background:linear-gradient(rgba(68,147,248,.22) 1px,transparent 1px) 0 0/100% 56px,linear-gradient(90deg,rgba(68,147,248,.16) 1px,transparent 1px) 0 0/72px 100%;
transform:perspective(640px) rotateX(62deg);transform-origin:50% 100%;
mask-image:linear-gradient(180deg,transparent 0,#000 34%,#000 82%,transparent 100%);
-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 34%,#000 82%,transparent 100%);
animation:rdGridScroll 3.2s linear infinite}
@keyframes rdGridScroll{from{background-position:0 0,0 0}to{background-position:0 56px,72px 0}}
.cover-beam{position:absolute;top:50%;left:50%;width:170vmax;height:170vmax;pointer-events:none;opacity:.5;
background:conic-gradient(from 0deg,transparent 0deg,rgba(68,147,248,.10) 18deg,transparent 42deg,transparent 160deg,rgba(139,92,246,.09) 190deg,transparent 220deg,transparent 300deg,rgba(34,211,238,.08) 330deg,transparent 360deg);
filter:blur(6px);animation:rdBeamSpin 26s linear infinite}
.cover-beam.b2{animation-duration:38s;animation-direction:reverse;opacity:.35}
@keyframes rdBeamSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.cover-stars{position:absolute;inset:0;pointer-events:none}
.cover-stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#cfe6ff;opacity:.7;box-shadow:0 0 6px rgba(120,180,255,.9);animation:rdStarDrift linear infinite}
@keyframes rdStarDrift{from{transform:translateY(14px);opacity:0}12%{opacity:.75}to{transform:translateY(-64px);opacity:0}}
.cover-orbit{position:absolute;top:50%;left:50%;width:560px;height:560px;transform:translate(-50%,-50%);pointer-events:none;opacity:0;animation:heroIn 1s ease .55s forwards}
.cover-orbit .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(68,147,248,.18)}
.cover-orbit .r2{inset:11%;border-color:rgba(139,92,246,.16);border-style:dashed;animation:rdSpin 30s linear infinite}
.cover-orbit .r3{inset:24%;border-color:rgba(34,211,238,.14);animation:rdSpin 22s linear infinite reverse}
.cover-orbit .sat{position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px rgba(34,211,238,.95)}
.cover-orbit .r3 .sat{background:var(--blue);box-shadow:0 0 12px rgba(68,147,248,.95)}
@keyframes rdSpin{to{transform:rotate(360deg)}}
.cover-inner{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:18px;padding:12px 32px}
.cover-kicker{font-size:11px;letter-spacing:5px;color:var(--cyan);border:1px solid rgba(34,211,238,.3);border-radius:999px;padding:4px 16px;background:rgba(34,211,238,.05);opacity:0;animation:heroIn .7s ease .15s forwards}
.cover-title{font-size:clamp(40px,6vw,84px);font-weight:800;line-height:1.08;text-align:center;letter-spacing:1px;opacity:0;
background:linear-gradient(120deg,#fff 15%,var(--blue) 45%,var(--cyan) 70%,#fff 95%);background-size:220% 100%;
-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(68,147,248,.35));
animation:heroIn .9s cubic-bezier(.2,.8,.2,1) .3s forwards,rdShimmer 7s ease-in-out 1.3s infinite}
@keyframes rdShimmer{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.cover-sub{font-size:clamp(13px,1.4vw,18px);color:var(--dim);text-align:center;opacity:0;animation:heroIn .8s ease .5s forwards}
.cover-sub b{color:var(--text);font-weight:600}
.cover-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:900px;margin-top:10px}
.chip{font-size:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);
opacity:0;transform:translateY(10px);animation:chipIn .5s cubic-bezier(.2,.8,.2,1) forwards;transition:border-color .3s,box-shadow .3s}
.chip em{font-style:normal;color:var(--cyan);font-size:10px;margin-right:5px;letter-spacing:1px}
@keyframes chipIn{to{opacity:1;transform:translateY(0)}}
.cover-hint{margin-top:14px;font-size:11px;color:var(--dim);letter-spacing:2px;opacity:0;animation:heroIn .8s ease 1.5s forwards}
@keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="stage-glow"></div>
<div style="display:flex;flex-direction:column;height:100vh;position:relative;z-index:1">
<div class="topbar">
<div class="brand">Roivy <em>Diagram</em></div>
<div class="crumb" id="crumb"></div>
<div class="navbtns">
<button type="button" id="btn-prev">&#8592;</button>
<button type="button" id="btn-next">&#8594;</button>
<button type="button" id="btn-home">&#9633;</button>
</div>
</div>
<section class="slide active">
<div class="cover">
<div class="cover-beam"></div>
<div class="cover-beam b2"></div>
<div class="cover-grid"></div>
<div class="cover-stars" id="cover-stars"></div>
<div class="cover-orbit"><div class="ring r1"><span class="sat"></span></div><div class="ring r2"></div><div class="ring r3"><span class="sat"></span></div></div>
<div class="cover-inner">
<div class="cover-kicker">ROIVY &#183; ENGINEERING DIAGRAM SUITE</div>
<h1 class="cover-title">Roivy Diagram</h1>
<div class="cover-sub">&#25226;&#19968;&#21477;&#35805;&#65292;&#21464;&#25104;&#19968;&#24352;&#33021;&#29992;&#30340;&#24037;&#31243;&#22270; &#8212; <b>&#20843;&#31181;&#22270;&#22411; &#183; &#31163;&#32447;&#21333;&#25991;&#20214; &#183; &#21487;&#32534;&#36753;&#21487;&#22238;&#36864;</b></div>
<div class="cover-chips" id="cover-chips"></div>
<div class="cover-hint">&#8594; &#26041;&#21521;&#38190;&#32763;&#39029; &#183; &#27599;&#39029;&#33258;&#21160;&#28436;&#31034;&#20809&#32447;&#27969;&#21160;</div>
</div>
</div>
</section>
<!--SCENES-->
</div>
<div class="progress" id="progress"></div>
<script>
var titles=['\u5c01\u9762','01 \u56e2\u961f','02 DFMEA','03 \u7535\u5b50','04 FA','05 \u8111\u56fe','06 \u5de5\u4f5c\u6d41','07 \u65f6\u5e8f','08 \u6570\u636e\u6d41','09 \u72b6\u6001\u673a'];
var slides=Array.prototype.slice.call(document.querySelectorAll('.slide'));
var current=0;
function render(){
slides.forEach(function(s,i){s.classList.toggle('active',i===current)});
document.getElementById('crumb').textContent=(current+1)+' / '+slides.length+' \u00b7 '+titles[current];
document.getElementById('progress').style.width=((current+1)/slides.length*100)+'%';
}
function go(d){current=Math.max(0,Math.min(slides.length-1,current+d));render()}
document.getElementById('btn-prev').addEventListener('click',function(){go(-1)});
document.getElementById('btn-next').addEventListener('click',function(){go(1)});
document.getElementById('btn-home').addEventListener('click',function(){current=0;render()});
document.addEventListener('keydown',function(e){
if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(1);
else if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
else if(e.key==='Home'){current=0;render()}
else if(e.key==='End'){current=slides.length-1;render()}});
render();
</script>
<!--AUTOPLAY-->
</body>
</html>
