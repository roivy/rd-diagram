name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rd-diagram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rd-diagram/package-lock.json
      - run: npm ci
      - name: Deterministic gates (template / brand marks / validators / identity / golden)
        run: npm run check:viewer && npm run check:brand-marks && npm run check:validators && npm run check:release-identity && node test/golden.mjs
      - name: Full test suite (unit + real-browser gates)
        run: node ../scripts/run-tests.mjs
